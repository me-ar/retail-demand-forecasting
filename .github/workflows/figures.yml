name: Generate figures

# Re-runs the analysis on GitHub's runners and commits the resulting charts.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/figures.yml"]

permissions:
  contents: write

jobs:
  figures:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt && pip install -e .
      - name: Run analysis
        run: python -m forecast.backtest
      - name: Commit figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/figures
          git diff --cached --quiet && exit 0
          git commit -m "Generate figures [skip ci]"
          git pull --rebase origin main
          git push

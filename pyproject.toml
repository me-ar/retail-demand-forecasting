[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast"
version = "1.0.0"
description = "90-day retail demand forecasting: rolling-origin backtest of baselines vs global LightGBM"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 115

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
per-file-ignores = { "src/forecast/backtest.py" = ["E402"] }
